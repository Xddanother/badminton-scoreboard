<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏸 羽毛球记分牌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 15px;
            color: white;
        }
        h1 { text-align: center; font-size: 1.6em; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #a0aec0; margin-bottom: 15px; font-size: 0.85em; }
        .save-status { text-align: center; font-size: 0.8em; color: #48bb78; margin-bottom: 10px; min-height: 20px; }
        
        .teams-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 700px;
            margin: 0 auto 20px;
        }
        
        .team-card {
            background: #2d3748;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .team-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .team-name {
            flex: 1;
            background: transparent;
            border: 2px solid #4a5568;
            border-radius: 8px;
            padding: 8px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
        }
        .team-name:focus { outline: none; border-color: #667eea; }
        
        .team-card:nth-child(1) .team-name { border-color: #f56565; color: #fc8181; }
        .team-card:nth-child(2) .team-name { border-color: #48bb78; color: #68d391; }
        .team-card:nth-child(3) .team-name { border-color: #ed8936; color: #f6ad55; }
        .team-card:nth-child(4) .team-name { border-color: #9f7aea; color: #b794f4; }
        
        .score-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .score-btn {
            width: 40px; height: 40px;
            border: none; border-radius: 50%;
            font-size: 1.4em; font-weight: bold;
            cursor: pointer;
        }
        .score-btn.minus { background: #fc8181; color: white; }
        .score-btn.plus { background: #68d391; color: white; }
        .score-btn:active { transform: scale(0.95); }
        
        .score-display {
            font-size: 2.5em;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
        .team-card:nth-child(1) .score-display { color: #f56565; }
        .team-card:nth-child(2) .score-display { color: #48bb78; }
        .team-card:nth-child(3) .score-display { color: #ed8936; }
        .team-card:nth-child(4) .score-display { color: #9f7aea; }
        
        .players-section {
            border-top: 1px solid #4a5568;
            padding-top: 12px;
        }
        .players-title {
            font-size: 0.8em;
            color: #a0aec0;
            margin-bottom: 8px;
            text-align: center;
        }
        .player-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        .player-num {
            font-size: 0.75em;
            color: #718096;
            width: 30px;
            text-align: right;
        }
        .player-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            background: #1a202c;
            color: white;
            font-size: 0.9em;
        }
        .player-input:focus { outline: none; border-color: #667eea; }
        .player-input::placeholder { color: #718096; }
        
        .buttons-section {
            max-width: 700px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.98); }
        .reset-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .random-btn { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        
        .lineup-result {
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
            background: #2d3748;
            border-radius: 15px;
            display: none;
        }
        .lineup-result.show { display: block; }
        .lineup-result h3 { text-align: center; margin-bottom: 15px; color: #fbd38d; }
        
        .lineup-team {
            margin-bottom: 12px;
            padding: 12px;
            background: #1a202c;
            border-radius: 10px;
        }
        .lineup-team-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        .lineup-team:nth-child(2) .lineup-team-name { color: #fc8181; }
        .lineup-team:nth-child(3) .lineup-team-name { color: #68d391; }
        .lineup-team:nth-child(4) .lineup-team-name { color: #f6ad55; }
        .lineup-team:nth-child(5) .lineup-team-name { color: #b794f4; }
        
        .lineup-order {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .lineup-player {
            background: #2d3748;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85em;
        }
        .lineup-player .num {
            color: #fbd38d;
            font-weight: bold;
        }
        
        .rules {
            max-width: 700px;
            margin: 20px auto;
            background: #2d3748;
            border-radius: 15px;
            padding: 20px;
        }
        .rules h3 { text-align: center; margin-bottom: 15px; color: #a0aec0; }
        .rule-section { margin-bottom: 15px; }
        .rule-title { font-weight: bold; color: #68d391; margin-bottom: 8px; }
        .rules ul { padding-left: 20px; font-size: 0.9em; color: #cbd5e0; line-height: 1.8; }
        .rules strong { color: #fbd38d; }

        @media (max-width: 500px) {
            .teams-container { grid-template-columns: 1fr; }
            .score-display { font-size: 2em; }
        }
    </style>
</head>
<body>
    <h1>🏸 羽毛球五羽轮比</h1>
    <p class="subtitle">点击队名或分数可编辑 | 数据自动保存</p>
    <div class="save-status" id="saveStatus"></div>

    <div class="teams-container" id="teamsContainer">
        <!-- 动态生成 -->
    </div>

    <div class="buttons-section">
        <button class="action-btn reset-btn" onclick="resetScores()">🔄 重置分数</button>
        <button class="action-btn random-btn" onclick="randomizeLineup()">🎲 随机抽签出场顺序</button>
    </div>

    <div class="lineup-result" id="lineupResult">
        <h3>📋 抽签结果 - 出场顺序</h3>
    </div>

    <div class="rules">
        <h3>📋 比赛规则</h3>
        <div class="rule-section">
            <div class="rule-title">1、单循环赛制</div>
            <ul>
                <li>采用单循环赛，每场比赛胜队记<strong>1分</strong>、负队记<strong>0分</strong></li>
                <li>积分多者胜；积分相同者，<strong>净胜分多者胜</strong></li>
                <li>4支队伍排出<strong>冠军、亚军和并列第三名</strong></li>
            </ul>
        </div>
        <div class="rule-section">
            <div class="rule-title">2、五羽轮比</div>
            <ul>
                <li>每队<strong>5名队员</strong>分为 1、2、3、4、5 号队员</li>
                <li>每场<strong>5局</strong>，每局<strong>15分</strong></li>
                <li>对阵顺序：<strong>12对12、23对23、34对34、45对45、51对51</strong></li>
                <li>第1局到15分换人换场地，第2局到30分换人换场地，以此类推</li>
                <li>第5局先到<strong>75分</strong>的队胜</li>
                <li>裁判由对阵双方轮流派出</li>
            </ul>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'badminton_v5';
        const DEFAULT_TEAMS = ['红队', '绿队', '橙队', '紫队'];
        
        let data = {
            teams: DEFAULT_TEAMS.map(name => ({
                name: name,
                score: 0,
                players: ['', '', '', '', '']
            }))
        };

        function init() {
            loadData();
            renderTeams();
        }

        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';
            
            data.teams.forEach((team, teamIdx) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                
                let playersHTML = '';
                for (let i = 0; i < 5; i++) {
                    playersHTML += `
                        <div class="player-row">
                            <span class="player-num">${i+1}号</span>
                            <input type="text" class="player-input" 
                                   id="player-${teamIdx}-${i}"
                                   value="${team.players[i] || ''}"
                                   placeholder="输入队员姓名"
                                   onchange="updatePlayer(${teamIdx}, ${i}, this.value)">
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="team-header">
                        <input type="text" class="team-name" 
                               value="${team.name}"
                               onchange="updateTeamName(${teamIdx}, this.value)">
                    </div>
                    <div class="score-section">
                        <button class="score-btn minus" onclick="changeScore(${teamIdx}, -1)">−</button>
                        <div class="score-display" id="score-${teamIdx}">${team.score}</div>
                        <button class="score-btn plus" onclick="changeScore(${teamIdx}, 1)">+</button>
                    </div>
                    <div class="players-section">
                        <div class="players-title">👥 队员名单</div>
                        ${playersHTML}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function updateTeamName(teamIdx, name) {
            data.teams[teamIdx].name = name;
            saveData();
        }

        function updatePlayer(teamIdx, playerIdx, name) {
            data.teams[teamIdx].players[playerIdx] = name;
            saveData();
        }

        function changeScore(teamIdx, delta) {
            data.teams[teamIdx].score = Math.max(0, data.teams[teamIdx].score + delta);
            document.getElementById(`score-${teamIdx}`).textContent = data.teams[teamIdx].score;
            saveData();
        }

        function resetScores() {
            if (confirm('确定要重置所有分数吗？')) {
                data.teams.forEach((team, idx) => {
                    team.score = 0;
                    document.getElementById(`score-${idx}`).textContent = 0;
                });
                saveData();
            }
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function randomizeLineup() {
            const resultDiv = document.getElementById('lineupResult');
            resultDiv.innerHTML = '<h3>📋 抽签结果 - 出场顺序</h3>';
            
            data.teams.forEach((team, teamIdx) => {
                const players = team.players.map((p, i) => p.trim() || `队员${i+1}`);
                const shuffled = shuffleArray(players);
                
                const teamDiv = document.createElement('div');
                teamDiv.className = 'lineup-team';
                
                let orderHTML = shuffled.map((name, i) => 
                    `<span class="lineup-player"><span class="num">${i+1}号:</span> ${name}</span>`
                ).join('');
                
                teamDiv.innerHTML = `
                    <div class="lineup-team-name">${team.name}</div>
                    <div class="lineup-order">${orderHTML}</div>
                `;
                resultDiv.appendChild(teamDiv);
            });
            
            resultDiv.classList.add('show');
        }

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    data = JSON.parse(saved);
                }
            } catch (e) {
                console.log('加载失败', e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                const status = document.getElementById('saveStatus');
                status.textContent = '✓ 已保存';
                setTimeout(() => { status.textContent = ''; }, 1500);
            } catch (e) {
                console.log('保存失败', e);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
